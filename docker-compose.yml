services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kantica-back-app
    restart: unless-stopped
    working_dir: /var/www
    # Même UID/GID que l'hôte : les fichiers créés dans le conteneur (storage,
    # vendor, .env, artisan make:*) restent modifiables par git et l'IDE.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      COMPOSER_HOME: /tmp/composer
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - kantica-network
    depends_on:
      - db
      - redis

  # Worker de la file d'attente : traite les imports de membres lancés en tâche de fond (KAN-31). Sans lui, un import
  # reste « pending ». `queue:listen` recharge le code à chaque tâche, ce que `queue:work` ne fait pas.
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kantica-back-queue
    restart: unless-stopped
    working_dir: /var/www
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    command: php artisan queue:listen --tries=1 --timeout=600
    environment:
      COMPOSER_HOME: /tmp/composer
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - kantica-network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: kantica-back-nginx
    restart: unless-stopped
    ports:
      - "8008:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - kantica-network
    depends_on:
      - app

  db:
    image: postgres:17-alpine
    container_name: kantica-back-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-kantica}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_USER: ${DB_USERNAME:-kantica_user}
    ports:
      - "6543:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - kantica-network

  redis:
    image: redis:alpine
    container_name: kantica-back-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - kantica-network

networks:
  kantica-network:
    driver: bridge

volumes:
  db-data:
    driver: local
