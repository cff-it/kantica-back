# .github/workflows/ci.yml
# kantica-back CI: checks code style and runs the test suite
# on every push and every pull request to develop and main.

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Cancel the previous run when pushing again to the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the jobs only need to read the repository
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Job 1: code style with Laravel Pint (fast, no database)
  # ---------------------------------------------------------------
  lint:
    name: Code style (Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'   # keep in sync with composer.json
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php8.4-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php8.4-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

  # ---------------------------------------------------------------
  # Job 2: tests against a real PostgreSQL database
  # ---------------------------------------------------------------
  tests:
    name: Tests
    runs-on: ubuntu-latest

    # PostgreSQL container running alongside the job
    services:
      postgres:
        image: postgres:17-alpine   # same as docker-compose.yml
        env:
          POSTGRES_DB: kantica_test
          POSTGRES_USER: kantica
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Variables read by Laravel (take precedence over .env)
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kantica_test
      DB_USERNAME: kantica
      DB_PASSWORD: secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'   # keep in sync with composer.json
          extensions: pdo_pgsql, pgsql, mbstring, zip, gd
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php8.4-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php8.4-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test

  # ---------------------------------------------------------------
  # Job 3: automatic code review by Claude (pull requests only)
  # Requires the repository secret ANTHROPIC_API_KEY.
  # ---------------------------------------------------------------
  claude-review:
    name: Claude review
    runs-on: ubuntu-latest
    # Skip pushes, draft PRs and PRs from forks (secrets are not available there)
    if: >-
      github.event_name == 'pull_request'
      && !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review pull request
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Write all comments in French.
            The PR branch is already checked out in the current working directory.
            Read CLAUDE.md first: it defines the architecture (Action Pattern,
            readonly Actions with __invoke(), Repositories, DTOs, thin Controllers)
            and the code style rules (Laravel Pint, pint.json).

            Focus on:
            - bugs and edge cases;
            - security (authorization, validation, mass assignment, SQL);
            - violations of the CLAUDE.md architecture rules;
            - performance (N+1 queries, missing eager loading);
            - missing or weak tests.
            Do not comment on formatting already enforced by Pint.

            Post each finding on the relevant line with
            `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`).
            Post a single short summary with `gh pr comment`.
            Only post GitHub comments, do not reply with plain messages.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
