; Processus du conteneur Railway. Les sorties partent vers stdout/stderr pour être lues dans les logs Railway.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Imports de membres et mails : sans worker, un import reste « pending » (KAN-31).
; --max-time relance le worker toutes les heures pour libérer la mémoire.
[program:queue]
command=php /var/www/artisan queue:work --tries=1 --timeout=600 --max-time=3600
user=www-data
environment=HOME="/tmp"
autorestart=true
stopwaitsecs=620
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
