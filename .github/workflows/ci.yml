# .github/workflows/ci.yml
# kantica-back CI: checks code style and runs the test suite
# on every push and every pull request to develop and main.

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Cancel the previous run when pushing again to the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the jobs only need to read the repository
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Job 1: code style with Laravel Pint (fast, no database)
  # ---------------------------------------------------------------
  lint:
    name: Code style (Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'   # keep in sync with composer.json
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php8.3-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php8.3-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

  # ---------------------------------------------------------------
  # Job 2: tests against a real PostgreSQL database
  # ---------------------------------------------------------------
  tests:
    name: Tests
    runs-on: ubuntu-latest

    # PostgreSQL container running alongside the job
    services:
      postgres:
        image: postgres:17-alpine   # same as docker-compose.yml
        env:
          POSTGRES_DB: kantica_test
          POSTGRES_USER: kantica
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Variables read by Laravel (take precedence over .env)
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kantica_test
      DB_USERNAME: kantica
      DB_PASSWORD: secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'   # keep in sync with composer.json
          extensions: pdo_pgsql, pgsql, mbstring, zip, gd
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php8.3-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php8.3-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test
